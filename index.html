<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThinkBeyond | Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Splash Video -->
  <div id="splash-screen">
    <video id="splash-video" muted playsinline preload="auto" autoplay>
      <source src="splash.mp4" type="video/mp4">
    </video>

    <!-- Progress bar -->
    <div id="splash-progress-bar">
      <div id="splash-progress-fill"></div>
    </div>

    <!-- Skip button -->
    <button id="skip-btn" aria-label="Skip intro">
      Skip Intro
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="13 17 18 12 13 7"></polyline>
        <polyline points="6 17 11 12 6 7"></polyline>
      </svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
