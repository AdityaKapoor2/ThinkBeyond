    function getCardinalNeighbors(index, rows = DEFAULT_GRID_ROWS, cols = DEFAULT_GRID_COLS) {
      const row = Math.floor(index / cols);
      const col = index % cols;
      const neighbors = [];

      if (row > 0) neighbors.push((row - 1) * cols + col);
      if (row < rows - 1) neighbors.push((row + 1) * cols + col);
      if (col > 0) neighbors.push(row * cols + (col - 1));
      if (col < cols - 1) neighbors.push(row * cols + (col + 1));

      return neighbors;
    }

    function calculateCityStats(grid, resources, rows = DEFAULT_GRID_ROWS, cols = DEFAULT_GRID_COLS) {
      let houseCount = 0;
      let roadCount = 0;
      let drainCount = 0;
      let granaryCount = 0;
      let wellCount = 0;
      let workshopCount = 0;

      const houseIndices = [];

      for (let i = 0; i < grid.length; i++) {
        const type = grid[i];
        if (type === 'H') {
          houseCount++;
          houseIndices.push(i);
        } else if (type === 'R') roadCount++;
        else if (type === 'D') drainCount++;
        else if (type === 'G') granaryCount++;
        else if (type === 'L') wellCount++;
        else if (type === 'K') workshopCount++;
      }

      const population = houseCount * 40;
      let connectedHouses = 0;
      const connectedHouseMap = {};

      for (const hIndex of houseIndices) {
        const neighbors = getCardinalNeighbors(hIndex, rows, cols);
        let hasRoad = false;
        let hasDrain = false;

        for (const nIndex of neighbors) {
          if (grid[nIndex] === 'R') hasRoad = true;
          if (grid[nIndex] === 'D') hasDrain = true;
        }

        const isConnected = hasRoad && hasDrain;
        if (isConnected) connectedHouses++;
        connectedHouseMap[hIndex] = isConnected;
      }

      const ratio = houseCount === 0 ? 1 : connectedHouses / houseCount;
      let health = Math.round(40 + ratio * 60);
      let happiness = Math.round(30 + ratio * 70);
      const trade = Math.min(100, workshopCount * 30 + wellCount * 10);

      if (resources.water <= 0 || resources.food <= 0) {
        happiness = Math.max(0, happiness - 20);
        health = Math.max(0, health - 10);
      }

      const civilizationScore = Math.round(
        population * 0.4 + health * 2 + happiness * 1.5 + trade
      );

      return {
        population,
        houseCount,
        roadCount,
        drainCount,
        granaryCount,
        wellCount,
        workshopCount,
        connectedHouses,
        connectedRatio: ratio,
        connectedHouseMap,
        health,
        happiness,
        trade,
        civilizationScore,
      };
    }

    function processEndTurn(grid, currentResources, rows = DEFAULT_GRID_ROWS, cols = DEFAULT_GRID_COLS) {
      const currentStats = calculateCityStats(grid, currentResources, rows, cols);
      const waterUse = Math.round(currentStats.population * 0.05);
      const foodUse = Math.round(currentStats.population * 0.05);

      const newWater = Math.min(200, Math.max(0, currentResources.water - waterUse + currentStats.wellCount * 15));
      const newFood = Math.min(200, Math.max(0, currentResources.food - foodUse + currentStats.granaryCount * 15));

      const updatedResources = {
        ...currentResources,
        water: newWater,
        food: newFood,
      };

      const updatedStats = calculateCityStats(grid, updatedResources, rows, cols);
      return { updatedResources, updatedStats };
    }

    function createInitialGrid(rows = DEFAULT_GRID_ROWS, cols = DEFAULT_GRID_COLS) {
      const grid = new Array(rows * cols).fill('.');
      for (let r = 0; r < rows; r++) {
        grid[r * cols] = 'W'; // Column 0 is the fixed river
      }
      return grid;
    }

    // ========================================================================
    // SOUND ENGINE
    // ========================================================================
    function useHarappaAudio() {
      const [isMuted, setIsMuted] = useState(false);
      const audioCtxRef = useRef(null);
      const masterGainRef = useRef(null);
      const ambientNodesRef = useRef(null);
      const hasInteractedRef = useRef(false);

      const getContext = useCallback(() => {
        if (!audioCtxRef.current) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtxRef.current = new AudioContextClass();
            masterGainRef.current = audioCtxRef.current.createGain();
            masterGainRef.current.gain.value = isMuted ? 0 : 1;
            masterGainRef.current.connect(audioCtxRef.current.destination);
          }
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      }, [isMuted]);

      useEffect(() => {
        if (masterGainRef.current && audioCtxRef.current) {
          masterGainRef.current.gain.setTargetAtTime(isMuted ? 0 : 1, audioCtxRef.current.currentTime, 0.05);
        }
      }, [isMuted]);

      const startAmbientBed = useCallback(() => {
        if (ambientNodesRef.current) return;
        const ctx = getContext();
        if (!ctx || !masterGainRef.current) return;

        try {
          const bufferSize = ctx.sampleRate * 2;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            output[i] = (b0 + b1 + b2) * 0.06;
          }

          const noiseSource = ctx.createBufferSource();
          noiseSource.buffer = noiseBuffer;
          noiseSource.loop = true;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 450;
          filter.Q.value = 1.2;

          const lfo = ctx.createOscillator();
          lfo.frequency.value = 0.18;
          const lfoGain = ctx.createGain();
          lfoGain.gain.value = 120;
          lfo.connect(filter.frequency);

          const ambientGain = ctx.createGain();
          ambientGain.gain.setValueAtTime(0.001, ctx.currentTime);
          ambientGain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 1.5);

          noiseSource.connect(filter);
          filter.connect(ambientGain);
          ambientGain.connect(masterGainRef.current);

          lfo.start();
          noiseSource.start();

          const potTapInterval = setInterval(() => {
            if (!audioCtxRef.current || isMuted) return;
            if (Math.random() < 0.4) {
              const now = audioCtxRef.current.currentTime;
              const tapOsc = audioCtxRef.current.createOscillator();
              const tapGain = audioCtxRef.current.createGain();
              const freq = Math.random() > 0.5 ? 460 : 540;

              tapOsc.type = 'sine';
              tapOsc.frequency.setValueAtTime(freq, now);
              tapOsc.frequency.exponentialRampToValueAtTime(freq * 0.85, now + 0.06);

              tapGain.gain.setValueAtTime(0.015, now);
              tapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

              tapOsc.connect(tapGain);
              tapGain.connect(masterGainRef.current);
              tapOsc.start(now);
              tapOsc.stop(now + 0.08);
            }
          }, 5000);

          ambientNodesRef.current = { noiseSource, lfo, ambientGain, interval: potTapInterval };
        } catch (e) {
          console.warn('Ambient error:', e);
        }
      }, [getContext, isMuted]);

      const playSound = useCallback((soundName) => {
        if (!hasInteractedRef.current) {
          hasInteractedRef.current = true;
          startAmbientBed();
        }
        if (isMuted) return;
        const ctx = getContext();
        if (!ctx || !masterGainRef.current) return;
        const now = ctx.currentTime;

        switch (soundName) {
          case 'place-house': {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(48, now + 0.08);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(masterGainRef.current);
            osc.start(now);
            osc.stop(now + 0.09);
            break;
          }
          case 'place-road': {
            const bufSize = ctx.sampleRate * 0.06;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1400, now);
            filter.frequency.exponentialRampToValueAtTime(750, now + 0.06);
            filter.Q.value = 2.5;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGainRef.current);
            noise.start(now);
            noise.stop(now + 0.07);
            break;
          }
          case 'place-drain': {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(130, now);
            osc.frequency.exponentialRampToValueAtTime(55, now + 0.07);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.connect(gain);
            gain.connect(masterGainRef.current);
            osc.start(now);
            osc.stop(now + 0.08);

            const gurgleOsc = ctx.createOscillator();
            const gurgleGain = ctx.createGain();
            gurgleOsc.type = 'sine';
            gurgleOsc.frequency.setValueAtTime(260, now + 0.04);
            gurgleOsc.frequency.linearRampToValueAtTime(180, now + 0.12);
            gurgleGain.gain.setValueAtTime(0.15, now + 0.04);
            gurgleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            gurgleOsc.connect(gurgleGain);
            gurgleGain.connect(masterGainRef.current);
            gurgleOsc.start(now + 0.04);
            gurgleOsc.stop(now + 0.13);
            break;
          }
          case 'place-special':
          case 'place-granary':
          case 'place-well':
          case 'place-workshop': {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(masterGainRef.current);
            osc.start(now);
            osc.stop(now + 0.09);

            const ringOsc = ctx.createOscillator();
            const ringGain = ctx.createGain();
            ringOsc.type = 'sine';
            ringOsc.frequency.setValueAtTime(680, now);
            ringGain.gain.setValueAtTime(0.18, now);
            ringGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
            ringOsc.connect(ringGain);
            ringGain.connect(masterGainRef.current);
            ringOsc.start(now);
            ringOsc.stop(now + 0.3);
            break;
          }
          case 'invalid': {
            [0, 0.07].forEach((delay) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(110, now + delay);
              osc.frequency.linearRampToValueAtTime(80, now + delay + 0.05);
              gain.gain.setValueAtTime(0.18, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.05);
              osc.connect(gain);
              gain.connect(masterGainRef.current);
              osc.start(now + delay);
              osc.stop(now + delay + 0.06);
            });
            break;
          }
          case 'clear-tile': {
            const bufSize = ctx.sampleRate * 0.08;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(2200, now);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGainRef.current);
            noise.start(now);
            noise.stop(now + 0.09);
            break;
          }
          case 'end-turn': {
            const harmonics = [
              { freq: 288, gain: 0.32, decay: 2.8 },
              { freq: 576, gain: 0.22, decay: 2.4 },
              { freq: 864, gain: 0.12, decay: 1.9 },
              { freq: 1152, gain: 0.06, decay: 1.4 }
            ];
            harmonics.forEach(({ freq, gain, decay }) => {
              const osc = ctx.createOscillator();
              const g = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq + (Math.random() - 0.5) * 1.5, now);
              g.gain.setValueAtTime(0.001, now);
              g.gain.linearRampToValueAtTime(gain, now + 0.03);
              g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
              osc.connect(g);
              g.connect(masterGainRef.current);
              osc.start(now);
              osc.stop(now + decay);
            });
            break;
          }
          case 'stat-increase': {
            const notes = [384, 480, 576];
            notes.forEach((freq, idx) => {
              const start = now + idx * 0.11;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, start);
              gain.gain.setValueAtTime(0.001, start);
              gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.24);
              osc.connect(gain);
              gain.connect(masterGainRef.current);
              osc.start(start);
              osc.stop(start + 0.25);
            });
            break;
          }
          case 'win': {
            const conchFreqs = [220, 440, 660, 880];
            conchFreqs.forEach((baseFreq) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(baseFreq, now);
              osc.frequency.linearRampToValueAtTime(baseFreq * 1.04, now + 1.6);
              const filter = ctx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(800, now);
              filter.frequency.linearRampToValueAtTime(1400, now + 1.2);
              gain.gain.setValueAtTime(0.001, now);
              gain.gain.linearRampToValueAtTime(0.12, now + 0.7);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
              osc.connect(filter);
              filter.connect(gain);
              gain.connect(masterGainRef.current);
              osc.start(now);
              osc.stop(now + 2.1);
            });

            const dholOsc = ctx.createOscillator();
            const dholGain = ctx.createGain();
            dholOsc.type = 'sine';
            dholOsc.frequency.setValueAtTime(78, now + 0.3);
            dholOsc.frequency.exponentialRampToValueAtTime(36, now + 0.3 + 0.45);
            dholGain.gain.setValueAtTime(0.45, now + 0.3);
            dholGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3 + 0.6);
            dholOsc.connect(dholGain);
            dholGain.connect(masterGainRef.current);
            dholOsc.start(now + 0.3);
            dholOsc.stop(now + 1.0);
            break;
          }
        }
      }, [getContext, isMuted, startAmbientBed]);

      return { playSound, isMuted, toggleMute: () => setIsMuted(!isMuted) };
    }

                                {renderToolIcon(activeTool, "w-6 h-6", HARAPPA_THEME.goldAccent)}
                              </div>
                            ) : (
                              <div className="w-1.5 h-1.5 rounded-full opacity-20" style={{ backgroundColor: HARAPPA_THEME.border }} />
                            )}
                          </div>
                        )}

                        {!isRiver && cellType !== '.' && (
                          <div className="flex flex-col items-center justify-center">
                            {renderToolIcon(cellType, "w-6 h-6 sm:w-7 sm:h-7", strokeColor)}
                            <span 
                              className="text-[8px] sm:text-[9px] font-semibold tracking-tighter uppercase mt-0.5"
                              style={{ color: strokeColor }}
                            >
                              {cellType === 'H' ? 'House' : cellType === 'R' ? 'Road' : cellType === 'D' ? 'Drain' : cellType === 'G' ? 'Granary' : cellType === 'L' ? 'Well' : 'Workshop'}
                            </span>
                          </div>
                        )}

                        {cellType === 'H' && (
                          <div 
                            className="absolute top-1 right-1 w-2 h-2 rounded-full"
                            style={{ backgroundColor: isConnectedHouse ? HARAPPA_THEME.successGood : HARAPPA_THEME.warningLow }}
                            title={isConnectedHouse ? "Connected to Road & Drain (+Health & Happiness)" : "Disconnected: Requires adjacent Road AND Drain"}
                          />
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* RIGHT STATS PANEL */}
            <aside 
              className="w-64 flex flex-col justify-between p-4 rounded-xl border shadow-lg overflow-y-auto"
              style={{
                backgroundColor: HARAPPA_THEME.panelBg,
                borderColor: HARAPPA_THEME.border,
              }}
            >
              <div>
                <div className="text-[11px] font-bold uppercase tracking-wider mb-3" style={{ color: HARAPPA_THEME.mutedGold }}>
                  City Demographics & Metrics
                </div>

                <div className="space-y-3">
                  <div 
                    className="p-2.5 rounded-lg border"
                    style={{ backgroundColor: HARAPPA_THEME.gridCanvasBg, borderColor: HARAPPA_THEME.border }}
                  >
                    <div className="flex justify-between items-center text-xs">
                      <span style={{ color: HARAPPA_THEME.creamMuted }}>Population</span>
                      <span className="font-mono font-bold" style={{ color: HARAPPA_THEME.creamText }}>
                        {cityStats.population}
                      </span>
                    </div>
                    <div className="text-[10px] mt-0.5" style={{ color: HARAPPA_THEME.creamMuted }}>
                      {cityStats.houseCount} house(s) × 40 citizens
                    </div>
                  </div>

                  <div 
                    className="p-2.5 rounded-lg border"
                    style={{ backgroundColor: HARAPPA_THEME.gridCanvasBg, borderColor: HARAPPA_THEME.border }}
                  >
                    <div className="flex justify-between items-center text-xs mb-1">
                      <span style={{ color: HARAPPA_THEME.creamMuted }}>Health</span>
                      <span className="font-mono font-bold" style={{ color: cityStats.health >= 70 ? HARAPPA_THEME.successGood : HARAPPA_THEME.warningLow }}>
                        {cityStats.health}%
                      </span>
                    </div>
                    <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: HARAPPA_THEME.panelBg }}>
                      <div 
                        className="h-full transition-all duration-300 rounded-full"
                        style={{ 
                          width: `${cityStats.health}%`, 
                          backgroundColor: cityStats.health >= 70 ? HARAPPA_THEME.successGood : HARAPPA_THEME.warningLow 
                        }}
                      />
                    </div>
                  </div>

                  <div 
                    className="p-2.5 rounded-lg border"
                    style={{ backgroundColor: HARAPPA_THEME.gridCanvasBg, borderColor: HARAPPA_THEME.border }}
                  >
                    <div className="flex justify-between items-center text-xs mb-1">
                      <span style={{ color: HARAPPA_THEME.creamMuted }}>Happiness</span>
                      <span className="font-mono font-bold" style={{ color: cityStats.happiness >= 70 ? HARAPPA_THEME.successGood : HARAPPA_THEME.warningLow }}>
                        {cityStats.happiness}%
                      </span>
                    </div>
                    <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: HARAPPA_THEME.panelBg }}>
                      <div 
                        className="h-full transition-all duration-300 rounded-full"
                        style={{ 
                          width: `${cityStats.happiness}%`, 
                          backgroundColor: cityStats.happiness >= 70 ? HARAPPA_THEME.successGood : HARAPPA_THEME.warningLow 
                        }}
                      />
                    </div>
                  </div>

                  <div 
                    className="p-2.5 rounded-lg border"
                    style={{ backgroundColor: HARAPPA_THEME.gridCanvasBg, borderColor: HARAPPA_THEME.border }}
                  >
                    <div className="flex justify-between items-center text-xs mb-1">
                      <span style={{ color: HARAPPA_THEME.creamMuted }}>Trade Capacity</span>
                      <span className="font-mono font-bold" style={{ color: HARAPPA_THEME.goldAccent }}>
                        {cityStats.trade}%
                      </span>
                    </div>
                    <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: HARAPPA_THEME.panelBg }}>
                      <div 
                        className="h-full transition-all duration-300 rounded-full"
                        style={{ width: `${cityStats.trade}%`, backgroundColor: HARAPPA_THEME.goldAccent }}
                      />
                    </div>
                  </div>

                  <div 
                    className="p-2.5 rounded-lg border text-xs"
                    style={{ 
                      backgroundColor: 'rgba(232, 199, 126, 0.08)', 
                      borderColor: 'rgba(232, 199, 126, 0.25)',
                      color: HARAPPA_THEME.goldAccent 
                    }}
                  >
                    <strong className="block text-[11px] uppercase tracking-wider mb-0.5">Directive</strong>
                    Connect houses to road and drain. Reach score 500.
                  </div>
                </div>
              </div>

              <div className="space-y-2 mt-4">
                <button
                  onClick={handleEndTurn}
                  className="w-full py-3 px-4 rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg transition-transform active:scale-[0.98] hover:brightness-105 flex items-center justify-center space-x-2"
                  style={{
                    backgroundColor: HARAPPA_THEME.goldAccent,
                    color: '#241b14',
                  }}
                >
                  <span>End Turn</span>
                  <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/15">
                    Turn {turnNumber}
                  </span>
                </button>

                <button
                  onClick={handleResetCity}
                  className="w-full py-2 px-3 rounded-lg text-xs font-semibold border transition-colors hover:border-red-500/50"
                  style={{
                    backgroundColor: HARAPPA_THEME.gridCanvasBg,
                    borderColor: HARAPPA_THEME.border,
                    color: HARAPPA_THEME.creamMuted,
                  }}
                >
                  Reset City
                </button>
              </div>
            </aside>
          </main>

          {/* 3. WIN BANNER */}
          {showWinBanner && (
            <section 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in"
            >
              <div 
                className="relative w-full max-w-lg rounded-2xl border-2 p-6 text-center shadow-2xl overflow-hidden"
                style={{
                  backgroundColor: HARAPPA_THEME.panelBg,
                  borderColor: HARAPPA_THEME.goldAccent,
                  color: HARAPPA_THEME.creamText,
                }}
              >
                <div className="w-16 h-16 mx-auto rounded-full border-2 flex items-center justify-center mb-3 shadow-inner" style={{ borderColor: HARAPPA_THEME.goldAccent, backgroundColor: HARAPPA_THEME.gridCanvasBg }}>
                  <TrophyIcon className="w-8 h-8" stroke={HARAPPA_THEME.goldAccent} />
                </div>

                <div className="text-[11px] font-mono uppercase tracking-widest font-bold" style={{ color: HARAPPA_THEME.goldAccent }}>
                  Civilization Milestone Achieved
                </div>

                <h2 className="text-xl sm:text-2xl font-black mt-1" style={{ color: HARAPPA_THEME.goldAccent }}>
                  {GAME_CONSTANTS.REWARD.badgeTitle}
                </h2>

                <p className="text-xs mt-1 leading-relaxed" style={{ color: HARAPPA_THEME.creamMuted }}>
                  Your standardized brick grid, sanitary conduits, and municipal trade satisfy the ancient civil bylaws of Meluhha!
                </p>

                <div className="grid grid-cols-2 gap-3 my-4">
                  <div 
                    className="p-3 rounded-xl border flex items-center space-x-3"
                    style={{ backgroundColor: HARAPPA_THEME.gridCanvasBg, borderColor: HARAPPA_THEME.border }}
                  >
                    <SparkleIcon className="w-6 h-6" stroke={HARAPPA_THEME.goldAccent} />
                    <div className="text-left">
                      <div className="text-[10px] uppercase font-bold" style={{ color: HARAPPA_THEME.mutedGold }}>Experience</div>
                      <div className="text-lg font-mono font-black" style={{ color: HARAPPA_THEME.goldAccent }}>
                        +{animatedXP} XP
                      </div>
                    </div>
                  </div>

                  <div 
                    className="p-3 rounded-xl border flex items-center space-x-3"
                    style={{ backgroundColor: HARAPPA_THEME.gridCanvasBg, borderColor: HARAPPA_THEME.border }}
                  >
                    <CoinIcon className="w-6 h-6" stroke={HARAPPA_THEME.goldAccent} />
                    <div className="text-left">
                      <div className="text-[10px] uppercase font-bold" style={{ color: HARAPPA_THEME.mutedGold }}>Ancient Coins</div>
                      <div className="text-lg font-mono font-black" style={{ color: HARAPPA_THEME.goldAccent }}>
                        +{animatedCoins} Coins
                      </div>
                    </div>
                  </div>
                </div>

                <div 
                  className="p-3.5 rounded-xl border text-left mb-4"
                  style={{ 
                    backgroundColor: 'rgba(46, 34, 22, 0.95)',
                    borderColor: HARAPPA_THEME.border,
                  }}
                >
                  <div className="flex items-center space-x-2 text-[10px] uppercase tracking-wider font-bold mb-1" style={{ color: HARAPPA_THEME.goldAccent }}>
                    <span>Knowledge Vault Unlocked</span>
                  </div>
                  <h4 className="text-xs font-bold" style={{ color: HARAPPA_THEME.creamText }}>
                    {GAME_CONSTANTS.REWARD.vaultTitle}
                  </h4>
                  <p className="text-[11px] mt-1 leading-relaxed" style={{ color: HARAPPA_THEME.creamMuted }}>
                    {GAME_CONSTANTS.REWARD.vaultLore}
                  </p>
                </div>

                <div className="flex flex-col sm:flex-row gap-2">
                  <button
                    onClick={() => setShowWinBanner(false)}
                    className="flex-1 py-2.5 px-4 rounded-lg font-bold text-xs uppercase tracking-wider border"
                    style={{ 
                      backgroundColor: HARAPPA_THEME.goldAccent, 
                      color: '#241b14' 
                    }}
                  >
                    Continue City (Sandbox)
                  </button>
                </div>
              </div>
            </section>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BuildHarappa />);
  </script>
</body>
</html>
